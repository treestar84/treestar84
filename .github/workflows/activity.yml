name: Update contribution animation

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: treestar84
          outputs: |
            dist/github-snake.svg?color_snake=%23376a29
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23d1f59b

      - name: Publish animations to output branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const branch = 'output';
            let previous;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              previous = (await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const entries = [];
            for (const path of ['github-snake.svg', 'github-snake-dark.svg']) {
              const content = await fs.readFile(`dist/${path}`, 'utf8');
              if (!content.includes('<svg')) throw new Error(`Invalid SVG: ${path}`);
              const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
              entries.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const tree = await github.rest.git.createTree({ owner, repo, tree: entries });
            if (previous && previous.tree.sha === tree.data.sha) {
              core.info('Contribution animation is unchanged.');
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'Update contribution animation', tree: tree.data.sha,
              parents: previous ? [previous.sha] : [],
              author: { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' }
            });
            if (previous) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            }
